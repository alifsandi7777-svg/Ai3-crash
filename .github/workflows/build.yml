name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cari dan ekstrak zip
        run: |
          ZIP=$(find . -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: file .zip tidak ditemukan di repo"
            exit 1
          fi
          echo "Zip ditemukan: $ZIP"
          unzip -q "$ZIP" -d project
          SETTINGS=$(find project -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts tidak ada di dalam zip"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ALIP-AI-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
